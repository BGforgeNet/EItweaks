name: build

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: .github/scripts/build-version.sh

      # Building the image compiles um-multitool, most of a cold run; the key covers what build/Containerfile copies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image
          key: build-image-${{ hashFiles('build/Containerfile', 'build/um-multitool.patch', 'build/go.mod', 'build/cmd/**', 'build/internal/**') }}

      - run: .github/scripts/build-image.sh

      # The third-party files the build fetches; the build checks each against its pinned checksum.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: downloads-${{ hashFiles('build/downloads.txt') }}

      - name: build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EITWEAKS_BUILD_IMAGE_READY: "1"
          EITWEAKS_DOWNLOADS: ${{ runner.temp }}/downloads
        run: scripts/build.sh "$VERSION" "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eitweaks-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
