; Universal Mod's um.dll for EItweaks: the settings it needs here. Every other setting keeps um.dll's default, and
; any of them can be added below (Universal Mod's docs list them).
; eix has SpellAddon built in, so no SpellAddonX.asi is needed.
SPELLADDON_ASI_CHECK=false
; Universal Mod's separate um-engine.dll is not installed.
UM_ENGINE=false
; D7VK is already the game's ddraw.dll, in the launcher's Engine folder.
DDRAW_DLL=""
; eix pads the game's heap blocks itself.
HEAP_ALLOC_PADDING=0
; The overlay stays enabled: um.dll installs its DirectDraw and window hooks (MSAA, interface drawing, borderless) only
; with it on. Its panels start hidden; F9 and F10 show them.
