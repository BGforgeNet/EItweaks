; eix's settings for EItweaks. Options: https://github.com/BGforgeNet/eix/blob/main/docs/eix-ini.md

[EngineFixes]
; The values page of the unit panel lists the spells of a unit outside the party.
UnitPanelSpells=1
; In windowed mode the mouse stays inside the game window (installer option, off by default).
ClipCursorToWindow=0

[AutoPause]
; Single player pauses when a party member falls below 25% health (installer option); the enemy events are off.
HealthPercent=25
EnemySighted=0
EnemyAggro=0
EnemyDead=0

[Encumbrance]
; The load a hero carries slows running and makes it cost more; above the maximum load it slows walking too.
Enabled=1
RunSlope=20
WalkSlope=20
MinSpeed=50
RunDrain=100

[Music]
; A track plays from Stream\<name>.flac, in the mod's or the game's folder, when there is one.
Flac=1
