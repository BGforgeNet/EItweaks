; eix's settings for EItweaks. Options: https://github.com/BGforgeNet/eix/blob/main/docs/eix-ini.md

[EngineFixes]
; The values page of the unit panel lists the spells of a unit outside the party.
UnitPanelSpells=1

[Encumbrance]
; The load a hero carries slows running and makes it cost more; above the maximum load it slows walking too.
Enabled=1
RunSlope=20
WalkSlope=20
MinSpeed=50
RunDrain=100
